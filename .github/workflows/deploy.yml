name: Dispatch Workflow

on:
  push:
    branches:
      - main

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
    - name: Trigger Workflow in olympiads Repository
      uses: peter-evans/repository-dispatch@v2
      with:
        token: ${{ secrets.GH_TOKEN }}
        repository: Beyond-Curriculum/olympiads
        event-type: build-website